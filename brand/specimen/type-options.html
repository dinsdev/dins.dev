<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dins type options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Fraunces:opsz,wght,SOFT@9..144,400..600,50&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&family=Instrument+Serif&family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1d1f; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); padding: 16px; font-family: system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; color: #ece9e2; padding: 4px 4px 16px; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 500; letter-spacing: .02em; }
  header button { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 1px solid #555; background: transparent; color: #ece9e2; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px; }
  .card { border-radius: 14px; padding: 32px 36px; display: flex; flex-direction: column; gap: 18px;
    background: #f4f1ea; color: #12181c; --muted: #4a555c; --accent: #0f6b6b; --btn-bg: #12181c; --btn-fg: #f4f1ea; --surface: #fff; --border: #ddd8cc; }
  body.dark .card { background: #1f1e1c; color: #ece9e2; --muted: #a29e95; --accent: #5cbfb8; --btn-bg: #ece9e2; --btn-fg: #1f1e1c; --surface: #2a2926; --border: #3a3834; }
  .tag { font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
  .tag b { color: var(--accent); font-weight: 500; }
  .marks { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .wordmark { font-family: var(--display); font-size: 68px; line-height: 1; letter-spacing: var(--wm-track, -0.02em); font-weight: var(--wm-weight, 500); }
  .wordmark b, .lockup b { color: var(--accent); font-weight: inherit; }
  .lockup { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 30px; letter-spacing: var(--wm-track, -0.02em); font-weight: var(--wm-weight, 500); }
  .lens { width: 46px; height: auto; color: currentColor; }
  h2 { font-family: var(--display); font-size: 54px; line-height: 1.02; letter-spacing: var(--h-track, -0.025em); font-weight: var(--h-weight, 500); }
  .role { font-family: var(--sans); font-size: 19px; }
  .body { font-family: var(--sans); font-size: 15.5px; line-height: 1.6; color: var(--muted); max-width: 54ch; }
  .prompt { font-family: var(--sans); display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 10px 10px 16px; font-size: 14.5px; color: var(--muted); }
  .prompt .go { width: 32px; height: 32px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--sans); }
  .btn { font-weight: 500; font-size: 14px; padding: 10px 18px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-fg); }
  .chip { font-size: 13px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); }
  .mono { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .mono em { font-style: normal; color: var(--accent); }
  .fonts { font-family: var(--mono); font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; line-height: 1.7; }
  .a { --display: "Newsreader", serif; --sans: "Schibsted Grotesk", sans-serif; --mono: "IBM Plex Mono", monospace; }
  .b { --display: "Fraunces", serif; --sans: "Instrument Sans", sans-serif; --mono: "JetBrains Mono", monospace; --wm-weight: 560; --h-weight: 520; }
  .b .wordmark, .b .lockup, .b h2 { font-variation-settings: "SOFT" 50; }
  .c { --display: "Instrument Serif", serif; --sans: "Geist", sans-serif; --mono: "Geist Mono", monospace; --wm-weight: 400; --h-weight: 400; --wm-track: -0.01em; --h-track: -0.015em; }
  .c .wordmark { font-size: 80px; } .c h2 { font-size: 64px; } .c .lockup { font-size: 36px; }
  .d { --display: "Bricolage Grotesque", sans-serif; --sans: "Bricolage Grotesque", sans-serif; --mono: "DM Mono", monospace; --wm-weight: 700; --h-weight: 650; --wm-track: -0.045em; --h-track: -0.04em; }
  .d .role, .d .body, .d .prompt, .d .row { font-variation-settings: "opsz" 14; }
</style>
</head>
<body>
<header>
  <h1>dins type options: same content, four type systems</h1>
  <button id="t" type="button">Switch to dark</button>
</header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="lens" viewBox="0 0 120 52">
    <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <circle cx="33" cy="28" r="19"/><circle cx="87" cy="28" r="19"/>
      <path d="M52 26 Q60 19 68 26"/><path d="M14 22 L5 19"/><path d="M106 22 L115 19"/>
    </g>
    <circle cx="94" cy="20" r="5" fill="var(--accent)"/>
  </symbol>
</svg>
<main class="grid" id="g"></main>
<template id="tpl">
  <section class="card">
    <div class="tag"><span class="name"></span><b class="note"></b></div>
    <div class="marks">
      <div class="wordmark">dins<b>.</b></div>
      <div class="lockup"><svg class="lens"><use href="#lens"/></svg>dins<b>.</b></div>
    </div>
    <h2>Hi, I'm Din.</h2>
    <div class="role">Data engineer building pipelines and AI systems.</div>
    <p class="body">I build data pipelines that turn messy sources into answers people can trust. Look closer and you'll find the tests, the evals and the decisions behind each one.</p>
    <div class="prompt"><span>What has Din shipped?</span><span class="go">&rarr;</span></div>
    <div class="row"><span class="btn">Get in touch</span><span class="chip">Best project</span><span class="chip">Data stack</span></div>
    <div class="mono">INDEX v3 · 412 chunks · built <em>2026-10-19</em></div>
    <div class="fonts"></div>
  </section>
</template>
<script>
  const opts = [
    ["a", "A · Editorial", "current candidate", "Display: Newsreader · Text: Schibsted Grotesk · Mono: IBM Plex Mono"],
    ["b", "B · Warm storybook", "most Ottie", "Display: Fraunces (soft) · Text: Instrument Sans · Mono: JetBrains Mono"],
    ["c", "C · Sharp modern", "most dev-tool", "Display: Instrument Serif · Text: Geist · Mono: Geist Mono"],
    ["d", "D · All grotesk", "no serif", "Display and text: Bricolage Grotesque · Mono: DM Mono"],
  ];
  const g = document.getElementById("g"), tpl = document.getElementById("tpl");
  for (const [cls, name, note, fonts] of opts) {
    const n = tpl.content.cloneNode(true), card = n.querySelector(".card");
    card.classList.add(cls);
    n.querySelector(".name").textContent = name;
    n.querySelector(".note").textContent = note;
    n.querySelector(".fonts").textContent = fonts;
    g.appendChild(n);
  }
  const t = document.getElementById("t");
  t.onclick = () => { const d = document.body.classList.toggle("dark"); t.textContent = d ? "Switch to light" : "Switch to dark"; };
</script>
</body>
</html>
